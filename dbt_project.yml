name: "schemaorg"
version: "1.0.0"

profile: "schemaorg"

model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros", "shared/macros"]
snapshot-paths: ["snapshots"]

clean-targets:
  - "target"
  - "dbt_packages"

models:
  schemaorg:
    +database: schemaorg
    +materialized: table
    # raw は取得したまま、stg は型付けと列名の付け替え。どちらも mart の SQL に展開し、テーブルは作らない
    vocab:
      raw:
        +materialized: ephemeral
      stg:
        +materialized: ephemeral
