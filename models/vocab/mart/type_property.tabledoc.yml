$schema: https://tabledoc.queria.io/schemas/table/v1.json
title: 型とプロパティの対応
description: |-
  型が直接持てるプロパティです。1 行が 1 型の 1 プロパティです。

  - 親の型から受け継ぐプロパティは含みません
sources: [releases]
columns:
  - name: version
    title: バージョン
  - name: type_name
    title: 型名
  - name: property_name
    title: プロパティ名
  - name: source_sha256
    title: 元のファイルの SHA-256
    description: この行を読んだファイルの SHA-256 です。source_file の sha256 に当たります
