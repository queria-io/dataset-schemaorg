$schema: https://tabledoc.queria.io/schemas/table/v1.json
title: プロパティ
description: |-
  schema.org のプロパティ（postalCode、latitude など）です。1 行が 1 プロパティです。

  - snake_case_name は Queria の列名にするときの形です
sources:
  - id: releases
    url: https://github.com/schemaorg/schemaorg/tree/main/data/releases
primary_key: [name]
columns:
  - name: version
    title: バージョン
  - name: name
    title: プロパティ名
  - name: uri
    title: URI
  - name: snake_case_name
    title: snake_case の名前
    description: name を snake_case にしたもの（postalCode → postal_code）
  - name: description
    title: 説明
    description: 原典の説明（英語）から HTML のタグを除いたもの
  - name: domain
    title: 持てる型
    description: このプロパティを持てる型。| 区切り
  - name: range
    title: 値の型
    description: 値に入れられる型。| 区切り
  - name: parent
    title: 親のプロパティ
  - name: equivalent_property
    title: 同等のプロパティ
    description: schema.org の外の同じ意味のプロパティの URI
  - name: inverse_of
    title: 逆のプロパティ
  - name: superseded_by
    title: 後継のプロパティ
    description: 値があれば非推奨です。こちらを使います
  - name: source_sha256
    title: 元のファイルの SHA-256
    description: この行を読んだファイルの SHA-256 です。source_file の sha256 に当たります
