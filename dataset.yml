# この dataset.yml は fdl commit が読む（FDL の dataset.json を YAML で書いたもの）。
# 表の説明は models/ の *.table.yml に書く。表と列の型・NULL・行数は fdl commit がカタログから埋める。
# Queria だけの項目（テーマ・カバー・列の意味）は annotations.queria に書く。
name: schemaorg
title: schema.org の語彙
description: |-
  schema.org が定める型とプロパティの語彙です。Web ページの構造化データで世界的に使われている語彙で、毎月 schema.org の最新のバージョンから取得し直します。

  出典：schema.org。Queria が加工したものです。
keywords:
  - 語彙
  - メタデータ
  - データ標準
  - 構造化データ
  - schema.org
homepage: https://github.com/queria-io/dataset-schemaorg
language: en

licenses:
  - id: CC-BY-SA-3.0
    spdx: CC-BY-SA-3.0
    url: https://creativecommons.org/licenses/by-sa/3.0/
    title: Creative Commons Attribution-ShareAlike 3.0 Unported
    commercial_use: true
    share_alike: true
    attribution_required: true

sources:
  - title: schema.org
    path: https://schema.org/
  - title: schemaorg/schemaorg
    path: https://github.com/schemaorg/schemaorg

contributors:
  - title: schema.org
    path: https://schema.org/
    roles: [rightsHolder]

update_frequency: monthly

schemas:
  - name: vocab
    title: 語彙

annotations:
  queria:
    themes: [other]
    cover: 🌐
...
